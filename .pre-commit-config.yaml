# "uv run pre-commit install" sets up both: ruff and gitleaks before each
# commit, the message check once the message is written
default_install_hook_types: [pre-commit, commit-msg]

# The local hooks check what CI checks, with the same tools
# (tests/test_tooling.py). gitleaks runs only here.
repos:
  # A secret pushed to a public repository is public, even if the commit is
  # removed later: gitleaks looks at the staged changes and stops the commit.
  # On GitHub, secret scanning and push protection check every push. The
  # revision is a commit, as for the actions (tests/test_supply_chain.py).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]


  - repo: local
    hooks:
      # ruff from uv.lock, the version CI runs: the ruff-pre-commit repo pinned
      # its own (0.15.12 against 0.14.14 in the lock), and a file the hook
      # accepted could fail CI. "unsupported" (formerly "system"): pre-commit
      # runs the command as it is, with no environment of its own.
      - id: ruff
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      # commitlint with commitlint.config.js, the rules and the list of types.
      # CI runs this same hook on every commit of a PR and on its title
      # (.github/workflows/commits.yml). pre-commit installs these packages
      # with the Node it finds, or downloads one.
      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: node
        additional_dependencies:
          - "@commitlint/cli@20.5.0"
          - "@commitlint/config-conventional@20.5.0"
        stages: [commit-msg]
