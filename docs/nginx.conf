# =============================================================================
# Nginx on the server, in front of compose.prod.yaml (docs/production.md)
# =============================================================================
# A file for /etc/nginx/conf.d/. Replace api.example.com, auth.example.com
# and the paths of the certificates (here Let's Encrypt's, from certbot).
# The stack listens on 127.0.0.1: the API on 8000, Keycloak on 8080.
# =============================================================================

# Requests per client address. /auth/ of the API and Keycloak's login form
# are where passwords are guessed and floods aim; 429 answers the excess.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=keycloak_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api.example.com auth.example.com;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# The API
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # The API answers 413 above SERVER_MAX_BODY_SIZE (64 KiB): stop the same
    # bodies here, before they cross to the container
    client_max_body_size 64k;

    # Inherited by every location below.
    # X-Request-ID: Nginx's id of this request, the one its log can show with
    # $request_id; the app keeps it in its log lines and in the response.
    # X-Forwarded-For: the client's address, which uvicorn trusts from the
    # stack's network only (SERVER_FORWARDED_ALLOW_IPS).
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    location /auth/ {
        limit_req zone=api_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}

# -----------------------------------------------------------------------------
# Keycloak: only what browsers and the API need
# -----------------------------------------------------------------------------
# /realms/ and /resources/, as Keycloak's guide on reverse proxies advises.
# Never /admin/ (the console answers on 127.0.0.1, KC_HOSTNAME_ADMIN) nor the
# management port 9000 (health and metrics), which compose never publishes.
server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    # Keycloak's redirects carry large cookies and headers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    # Read by Keycloak (KC_PROXY_HEADERS=xforwarded) from the stack's network
    # only (KC_PROXY_TRUSTED_ADDRESSES)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location /realms/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # The administrators' realm: only the console uses it, on 127.0.0.1.
    # ^~ keeps the login-actions rule below from matching it.
    location ^~ /realms/master/ {
        return 404;
    }

    # The login form posts here
    location ~ ^/realms/[^/]+/login-actions/ {
        limit_req zone=keycloak_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /resources/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
