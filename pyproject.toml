[project]
name = "fastapi_starter"
version = "0.7.1"
description = "Fastapi starter with settings, logging, auth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.12.5",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=1.19.1",
    "pre-commit>=4.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pyyaml>=6.0",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_starter"]

# =============================================================================
# UV - one version in CI and in the image, checked by tests/test_lockfile.py
# =============================================================================
[tool.uv]
# uv 0.12 and older rewrite uv.lock in an older format as soon as anything in
# it changes. CI and docker/Dockerfile pin an exact version, at least this one.
required-version = ">=0.13.0"

# =============================================================================
# RUFF - Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort 
    "N",      # pep8-naming
    "UP",     # pyupgrade 
    "B",      # flake8-bugbear 
    "SIM",    # flake8-simplify
    "PLC0415", # imports at the top of the module, never inside a function
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_starter"]


# =============================================================================
# MYPY - Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
]
ignore_missing_imports = true


# =============================================================================
# IMPORT-LINTER - Architecture rules, checked in CI with: uv run lint-imports
# =============================================================================
[tool.importlinter]
root_package = "fastapi_starter"
# Lets the contracts below name third-party packages (jwt, httpx, sqlalchemy)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: main, serve, healthcheck -> setup, exception_handlers -> features -> core"
type = "layers"
layers = [
    # The entry points: the app factory and the image's two commands
    "fastapi_starter.main | fastapi_starter.serve | fastapi_starter.healthcheck",
    "fastapi_starter.setup | fastapi_starter.exception_handlers",
    "fastapi_starter.features",
    "fastapi_starter.core",
]
broken_contract_guidance = """
A module imports from a layer above its own. core is the infrastructure
features build on, setup.py wires adapters to ports, main.py builds the
app. Move the shared code down a layer, or have the layer above pass it
in, as setup.py does with the adapters."""

[[tool.importlinter.contracts]]
name = "Ports import no adapter"
type = "forbidden"
source_modules = ["fastapi_starter.**.protocols"]
forbidden_modules = [
    "fastapi_starter.core.auth.extractors",
    "fastapi_starter.core.auth.jwks",
    "fastapi_starter.core.auth.jwks_manager",
    "fastapi_starter.core.auth.service",
    "fastapi_starter.core.database.manager",
    "fastapi_starter.features.auth.client",
]
broken_contract_guidance = """
A protocol (port) imports an implementation (adapter). Adapters depend
on ports, never the other way round: put the types a port needs in a
schemas module. A new adapter goes in forbidden_modules above."""

[[tool.importlinter.contracts]]
name = "AuthService knows no JWT or HTTP library"
type = "forbidden"
source_modules = ["fastapi_starter.core.auth.service"]
forbidden_modules = ["jwt", "httpx"]
broken_contract_guidance = """
AuthService works only through its ports, TokenDecoder and ClaimExtractor.
PyJWT belongs in core/auth/jwks.py, httpx in the Keycloak adapters."""

[[tool.importlinter.contracts]]
name = "Auth knows no database"
type = "forbidden"
source_modules = ["fastapi_starter.core.auth"]
forbidden_modules = ["fastapi_starter.core.database", "sqlalchemy"]
broken_contract_guidance = """
Validating a token needs no database. If auth ever needs stored data,
define a port in core/auth/protocols.py and wire its adapter in setup.py."""

[[tool.importlinter.contracts]]
name = "Routers reach external services only through ports"
type = "forbidden"
source_modules = ["fastapi_starter.features.*.router"]
forbidden_modules = ["httpx"]
broken_contract_guidance = """
A router imports the HTTP client. OAuthProvider promises that its
adapters raise only UnauthorizedError and ExternalServiceError: catch
those. An httpx exception reaching a router is a bug in the adapter."""


# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The integration tests need a real Postgres and the end-to-end ones the
# running stack, so a plain "pytest" leaves them out. "pytest -m integration"
# or "pytest -m e2e" runs only those: the last -m wins.
addopts = ["-v", "--tb=short", "-m", "not integration and not e2e"]
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_*); every test in tests/integration/",
    "e2e: needs the stack of compose.yaml running; every test in tests/e2e/",
]
# pytest 9: a typo in a marker or in this section becomes an error instead
# of a warning (strict_markers, strict_config). Also enables strict_xfail
# and strict_parametrization_ids.
strict = true


# =============================================================================
# COVERAGE — CI runs "pytest --cov" and fails below fail_under
# =============================================================================
[tool.coverage.run]
source = ["fastapi_starter"]
branch = true

[tool.coverage.report]
# Raised when coverage grows, never lowered. At 99.16% a margin of about one
# point leaves room for a branch hard to reach, not for an untested module.
fail_under = 98
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
]
