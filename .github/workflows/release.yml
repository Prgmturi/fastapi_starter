name: Release

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    name: Prepare or tag release
    # A named Ubuntu, as in ci.yml: the image changes when we choose
    runs-on: ubuntu-24.04

    permissions:
      contents: write       # create tags and GitHub Releases
      pull-requests: write  # open and update the Release PR

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # No release-type input: with it the action builds its config from the
      # inputs alone and ignores release-please-config.json (bump rules, tag
      # format). Everything lives in that file and in the manifest.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
