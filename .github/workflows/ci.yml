name: CI

on:
  push:
  pull_request:

permissions: {}

env:
  # The uv of every job, the same as in docker/Dockerfile (tests/test_lockfile.py).
  # Without a version, setup-uv installs the newest uv.
  UV_VERSION: "0.13.5"

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch full history so commitlint can walk back to the base branch
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli@20.5.0 @commitlint/config-conventional@20.5.0

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      # --locked: stop if uv.lock is out of date with pyproject.toml.
      # --frozen installed it without comparing the two.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      # Who may import whom: the contracts are in pyproject.toml, under
      # [tool.importlinter]
      - name: Import contracts
        run: uv run lint-imports

      # La soglia (fail_under) sta in pyproject.toml. La tabella finisce
      # anche nel riepilogo del run, senza aprire i log.
      - name: Tests
        run: uv run pytest --tb=short --cov --cov-report=term --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

      # I test non devono dipendere dalla macchina che li lancia: con un .env
      # e variabili da produzione il risultato deve restare identico.
      - name: Tests in a production-like environment
        env:
          APP_ENVIRONMENT: production
          SERVER_TRUSTED_HOSTS: '["api.example.com"]'
        run: |
          printf 'KEYCLOAK_COOKIE_NAME=__Host-rt\nKEYCLOAK_COOKIE_SECURE=false\n' > .env
          uv run pytest -q --tb=short -p no:cacheprovider

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # A Postgres for this job only, the image of docker/docker-compose.yaml.
    # GitHub starts it before the steps and waits until pg_isready answers.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appbase_test
          POSTGRES_USER: appbase
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appbase -d appbase_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # The same database as the service above, as the tests read it
    # (tests/integration/settings.py)
    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: appbase_test
      TEST_DATABASE_USER: appbase
      TEST_DATABASE_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # The migrations on the same database, as a deploy runs them: up to
      # head, compared with the models (a model changed without its migration
      # fails here), down to nothing and up again. alembic/env.py reads
      # DATABASE_*, the app's variables.
      - name: Migrations up, check, down and up
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: appbase_test
          DATABASE_USER: appbase
          DATABASE_PASSWORD: ci-only-password
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      # -m integration replaces the -m "not integration" of addopts
      - name: Integration tests
        run: uv run pytest -m integration --tb=short

  docker:
    name: Build container image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Il codice sorgente passava tutti i controlli mentre l'immagine
      # non compilava: pyproject dichiara readme = "README.md" ma il builder
      # non lo copiava. Nessun job verificava l'artefatto che si distribuisce.
      # Questo job chiude quel buco.
      - name: Build image
        run: docker build -f docker/Dockerfile -t fastapi-starter:ci .

      # Smoke test senza servizi esterni: create_app() costruisce settings,
      # logging, middleware e router, come fa uvicorn --factory all'avvio.
      # Database e Keycloak restano fuori — vengono toccati solo nel lifespan.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint python fastapi-starter:ci \
            -c "from fastapi_starter.main import create_app; app = create_app(); assert app.routes; print(f'{len(app.routes)} routes registered')"
