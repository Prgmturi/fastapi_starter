name: CI

on:
  push:
  pull_request:

permissions: {}

env:
  # The uv of every job, the same as in docker/Dockerfile (tests/test_lockfile.py).
  # Without a version, setup-uv installs the newest uv.
  UV_VERSION: "0.13.5"

# Every job names its Ubuntu: ubuntu-latest moves to 26.04 between 19 October
# and 19 November 2026, one repository at a time, so the image would change on
# a run nobody chose (tests/test_tooling.py). Commit messages: commits.yml.
# Every action is pinned to a commit, with its version in a comment: a tag
# can be moved to other code (tests/test_supply_chain.py).
jobs:
  ci:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      # --locked: stop if uv.lock is out of date with pyproject.toml.
      # --frozen installed it without comparing the two.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      # Who may import whom: the contracts are in pyproject.toml, under
      # [tool.importlinter]
      - name: Import contracts
        run: uv run lint-imports

      # The threshold (fail_under) is in pyproject.toml. The table also goes
      # to the summary of the run, so it can be read without the logs.
      - name: Tests
        run: uv run pytest --tb=short --cov --cov-report=term --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

      # The tests must not depend on the machine that runs them: with a .env
      # and production variables the result must stay the same. Both hold
      # settings the app refuses to start with: a __Host- cookie without
      # Secure, and a variable name from before 0.8.0.
      - name: Tests in a production-like environment
        env:
          APP_ENVIRONMENT: production
          SERVER_TRUSTED_HOSTS: '["api.example.com"]'
          KEYCLOAK_COOKIE_NAME: rt
        run: |
          printf 'AUTH_COOKIE_NAME=__Host-rt\nAUTH_COOKIE_SECURE=false\n' > .env
          uv run pytest -q --tb=short -p no:cacheprovider

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    # A Postgres for this job only, the image of docker/docker-compose.yaml.
    # GitHub starts it before the steps and waits until pg_isready answers.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appbase_test
          POSTGRES_USER: appbase
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appbase -d appbase_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # The same database as the service above, as the tests read it
    # (tests/integration/settings.py)
    env:
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: appbase_test
      TEST_DATABASE_USER: appbase
      TEST_DATABASE_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # The migrations on the same database, as a deploy runs them: up to
      # head, compared with the models (a model changed without its migration
      # fails here), down to nothing and up again. alembic/env.py reads
      # DATABASE_*, the app's variables.
      - name: Migrations up, check, down and up
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: appbase_test
          DATABASE_USER: appbase
          DATABASE_PASSWORD: ci-only-password
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      # -m integration replaces the -m "not integration" of addopts
      - name: Integration tests
        run: uv run pytest -m integration --tb=short

  e2e:
    name: Log in through the whole stack
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # As from a clean clone: no .env, every value from compose.yaml.
      # --wait returns once every service is healthy and migrate has exited.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300

      # tests/e2e: a browser's login through Keycloak, then the API with the
      # token, the refresh cookie and the logout
      - name: Log in through Keycloak
        run: uv run pytest -m e2e --tb=short

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color

  docker:
    name: Build container image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write   # the scan's report, in Code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The code passed every check while the image did not build:
      # pyproject.toml names README.md as readme, and the builder did not copy
      # it. No job checked what is shipped; this one does.
      - name: Build image
        run: docker build -f docker/Dockerfile -t fastapi-starter:ci .

      # Smoke test without external services: create_app() builds settings,
      # logging, middleware and routes, as uvicorn does when the process
      # starts. Database and Keycloak are touched only by the lifespan.
      # One route of each router, asked for by name: url_path_for fails when
      # it is missing. len(app.routes) is not the number of routes: since
      # FastAPI 0.137 an included router is one entry (tests/test_smoke.py).
      - name: Smoke test
        run: |
          docker run --rm fastapi-starter:ci python -c \
            "from fastapi_starter.main import create_app; app = create_app(); print('routes found:', *(app.url_path_for(name) for name in ('root', 'liveness', 'get_me', 'list_notes')))"

      # The app runs as appuser, who must not be able to change its own
      # code: as the owner, a process taken over could rewrite it, and a
      # restarted container would run the rewritten copy.
      - name: The app cannot change its code
        run: |
          docker run --rm fastapi-starter:ci python -c \
            "import os, fastapi_starter as p; d = os.path.dirname(p.__file__); assert not os.access(d, os.W_OK), d; print(d, 'is read-only for', os.getuid())"

      # Grype on the image just built, Debian packages and Python ones: it
      # fails on a High or Critical vulnerability that has a fix. On 25
      # October 2026 the image had 55 High without one, in Debian: failing
      # on those would fail every build with nothing to do about it.
      - name: Scan the image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: fastapi-starter:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      # The report in the Security tab of the repository, also when the scan
      # has failed the build: scan-action sets its sarif output then too.
      # Without a scan (a step before it failed) there is no report, and the
      # upload would only add an error of its own.
      - name: Upload the scan report
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype
