# =============================================================================
# Keycloak + PostgreSQL
# =============================================================================
# Questo compose gestisce l'infrastruttura di autenticazione.
# Keycloak ha il suo database Postgres dedicato.
#
# Uso:
#   docker compose up -d
#
# Accesso:
#   - Keycloak Admin: http://localhost:8080
#   - Health check:   http://localhost:9000/health
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL per Keycloak
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:17-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?copia infra/.env.example in infra/.env}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?copia infra/.env.example in infra/.env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copia infra/.env.example in infra/.env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak
  # ---------------------------------------------------------------------------
  keycloak:
    # Versione pinnata: :latest cambia sotto i piedi e può rimuovere
    # variabili d'ambiente da un giorno all'altro.
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    command: start-dev
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Admin
      # Da Keycloak 26 i nomi sono KC_BOOTSTRAP_ADMIN_*; KEYCLOAK_ADMIN
      # e KEYCLOAK_ADMIN_PASSWORD funzionano ancora ma emettono
      # KC-SERVICES0110 (deprecated) e spariranno.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?copia infra/.env.example in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copia infra/.env.example in infra/.env}
      # Features
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"   # Admin console e API
      - "9000:9000"   # Health e metrics
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped

networks:
  keycloak-network:
    name: keycloak-network

volumes:
  keycloak_db_data:
    name: keycloak_db_data